[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "agent21"
version = "0.1.6"
description = "Project-level configuration and synchronization for AI coding agents"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["ai", "coding-agent", "cli", "agents-md", "mcp"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
dependencies = [
  "PyYAML>=6.0.2,<7",
  "typer>=0.16,<1",
]

[project.urls]
Homepage = "https://github.com/jeweis/agent21"
Repository = "https://github.com/jeweis/agent21"
Issues = "https://github.com/jeweis/agent21/issues"

[project.scripts]
agent21 = "agent21.cli:app"

[dependency-groups]
dev = [
  "build>=1.3,<2",
  "jsonschema>=4.25,<5",
  "mypy>=1.17,<3",
  "nox>=2025.5,<2027",
  "pip-audit>=2.9,<3",
  "pytest>=8.4,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.12,<1",
  "syrupy>=4.9,<6",
  "twine>=6.1,<7",
  "types-PyYAML>=6.0.12,<7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/agent21"]

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config"
testpaths = ["tests"]
markers = [
  "unit: isolated logic without product workflows",
  "adapter: one agent adapter contract",
  "contract: public CLI or versioned schema contract",
  "integration: multiple components in an isolated project",
  "e2e: installed console script behavior",
  "compatibility: platform, Python, or sync-mode behavior",
  "snapshot: stable user-visible output baseline",
  "safety: file protection, boundary, permission, or secret handling",
  "slow: intentionally excluded from the fast pull-request subset",
]

[tool.coverage.run]
branch = true
source = ["agent21"]
parallel = true

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true
exclude_also = [
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
  "raise NotImplementedError",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["agent21"]
exclude = ["tests/fixtures/"]

[[tool.mypy.overrides]]
module = ["yaml.*", "syrupy.*"]
ignore_missing_imports = true
