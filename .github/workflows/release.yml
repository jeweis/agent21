name: Release Gate

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-validation:
    name: ${{ matrix.os }} Python ${{ matrix.python-version }} release session
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: '3.11'
          - os: ubuntu-latest
            python-version: '3.14'
          - os: windows-latest
            python-version: '3.11'
          - os: windows-latest
            python-version: '3.14'
          - os: macos-latest
            python-version: '3.11'
          - os: macos-latest
            python-version: '3.14'
    steps:
      - name: Check out exact release candidate
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v9
        with:
          enable-cache: true

      - name: Install locked development environment
        run: uv sync --locked --group dev

      - name: Record runner image
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "runner_os=${{ runner.os }}"
            echo "image_os=${ImageOS:-unknown}"
            echo "image_version=${ImageVersion:-unknown}"
          } | tee runner-image.txt

      - name: Run release validation session
        run: uv run nox -s release

      - name: Upload release validation evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-evidence-${{ matrix.os }}-${{ matrix.python-version }}
          path: |
            runner-image.txt
            .coverage*
            coverage.xml
            htmlcov/
            junit*.xml
            pytest*.xml
            test-results/
            reports/
            dist/
          if-no-files-found: ignore

  build-distribution:
    name: Build release distributions
    runs-on: ubuntu-latest
    needs: release-validation
    steps:
      - name: Check out exact release candidate
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Set up uv
        uses: astral-sh/setup-uv@v9
        with:
          enable-cache: true

      - name: Install locked development environment
        run: uv sync --locked --group dev

      - name: Build and validate package artifacts
        run: uv run nox -s package

      - name: Upload distributions
        uses: actions/upload-artifact@v7
        with:
          name: release-distributions
          path: dist/*
          if-no-files-found: error

  release-gate:
    name: Release Gate status
    runs-on: ubuntu-latest
    needs:
      - release-validation
      - build-distribution
    if: always()
    steps:
      - name: Block on missing or failed release checks
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ needs.release-validation.result }}" != "success" ]]; then
            echo "Release validation matrix did not pass." >&2
            exit 1
          fi
          if [[ "${{ needs.build-distribution.result }}" != "success" ]]; then
            echo "Release distribution build did not pass." >&2
            exit 1
          fi
          echo "Release Gate passed; protected publishing environment may request approval."

  publish-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: release-gate
    environment:
      name: pypi
      url: https://pypi.org/project/agent21/
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download release distributions
        uses: actions/download-artifact@v8
        with:
          name: release-distributions
          path: dist

      - name: Publish with PyPI Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
